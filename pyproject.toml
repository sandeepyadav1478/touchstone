[project]
name = "touchstone"
version = "0.1.0"
description = "An agent-improvement loop that is required to prove the improvement"
readme = "README.md"
authors = [
    { name = "Sandeep Yadav", email = "sandeepyadav1478@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk~=0.2",
    "httpx~=0.28",
    "langchain-core~=1.6",
    # D-075: capped at MLflow's tested autolog ceiling, not the latest release.
    # mlflow/ml_package_versions.py declares langgraph autolog 0.6.2..1.2.9.
    "langgraph==1.2.9",
    "mlflow-skinny~=3.15",
    "pydantic~=2.13",
    # Ceiling is deliberate, not latest-wins: deepeval requires rich<15.0.0 and is
    # the chosen diagnostic library (D-076). We use exactly one symbol from rich
    # (`Console`, doctor.py), stable since 1.x, so the ceiling costs nothing and
    # keeps D-076 a one-line add instead of a dependency renegotiation.
    "rich>=13.8,<15",
    "tau2==1.0.1",
    "typer~=0.27",
]

# D-076 -- DeepEval is the diagnostic metric library BEHIND the gate, reached
# through MLflow's first-party adapter (mlflow/genai/scorers/deepeval).
#
# It is an optional extra, and the split is the point: MLflow's own registry
# marks 28 of its 30 metrics `is_deterministic=False` -- ToolCorrectness,
# StepEfficiency and PlanAdherence included. Those are LLM-judged, so they are
# excellent DIAGNOSTICS and disqualified as GATES. Gates run `@scorer`
# predicates we write. Nothing that gates may import this extra.
[project.optional-dependencies]
diagnostics = ["deepeval~=4.1"]

[project.scripts]
touchstone = "touchstone.cli:app"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "ruff~=0.16",
    "mypy~=2.3",
    "pillow~=12.1",
]

# ─────────────────────────────────────────────────────────────────────────────
# D-054 — the standard is enforced typing, not classes-for-their-own-sake.
# LangGraph's `add_node` takes a callable, so nodes stay functions; what makes
# them rigorous is that every signature is checked, not that it is wrapped.
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # pep8-naming
    "UP",       # pyupgrade — this repo is 3.12+, no legacy typing
    "B",        # bugbear
    "A",        # shadowed builtins
    "C4",       # comprehensions
    "PT",       # pytest style
    "SIM",      # simplify
    "ARG",      # unused arguments — catches a node that ignores `state`
    "PTH",      # pathlib over os.path
    "RUF",      # ruff's own
    "ANN",      # every signature annotated
    "D",        # docstrings
]
ignore = [
    "D105",     # magic-method docstring — __call__ on a tool is self-describing
    "D107",     # __init__ docstring — the class docstring covers it
    "ANN401",   # explicit Any, needed for LangGraph's dict[str, Any] node return
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves by name; the assertion IS the docstring.
# ⛔ D103 ONLY. D100, ANN201 and ANN001 stood here and were removed on 2026-08-20 after
# being measured one at a time: dropping D103 produces 6 errors, dropping any of the other
# three produces none. They were exempting nothing.
# 🎯 ANN201/ANN001 are the dangerous pair to leave lying around: they exempt exactly the
# un-annotated test signatures that mypy's own dead `tests.*` override had been silently
# permitting for this project's whole life. Two tools carrying the same hole, one of which
# had already fired, is not a hole worth keeping for symmetry.
"tests/**" = ["D103"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# The agent SDK, tau2 and mlflow ship no stubs. Untyped THIRD-PARTY code is
# tolerated; untyped code in `src/` is not.
ignore_missing_imports = true
disallow_untyped_defs = true

# ─────────────────────────────────────────────────────────────────────────────
# D-072 — tau2 is the specimen and it is pinned twice on purpose: the version in
# [project.dependencies] and the tag here. `tau2` on PyPI is an UNRELATED project
# ("magnetic relaxation rates", gitlab.com/chilton-group/tau2) — DEF-050 — so a
# bare requirement without this source table resolves to the wrong package.
#
# ⛔ THE CODE SHIPS; THE DATA DOES NOT. `data/` sits outside `src/` in that repo,
# so no wheel contains it. Installed, tau2 computes DATA_DIR as
# `Path(__file__).parents[3] / "data"` => `.venv/lib/python3.12/data`, which does
# not exist — and it only logs a WARNING. Set TAU2_DATA_DIR to a checkout's
# `data/` or the 114 tasks, db.json and policy.md are all absent. DEF-051.
# ─────────────────────────────────────────────────────────────────────────────
[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "v1.0.1" }

# ⛔ There is NO tests exemption, and the reason is that the one written here never
# worked. `module = ["tests.*"]` matched nothing: `tests/` has no `__init__.py`, so
# mypy computes the module name as `test_doctor`, not `tests.unit.test_doctor`. The
# declared standard and the enforced one had disagreed since the file was written —
# `uv run mypy src tests` reported 4 errors the whole time. Fixed by annotating the
# tests rather than by making the exemption match, because the exemption was lowering
# a standard D-054 exists to raise.
